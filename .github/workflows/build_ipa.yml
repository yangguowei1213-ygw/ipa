name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned archive
        run: |
          xcodebuild archive \
            -project BackgroundCleaner.xcodeproj \
            -scheme BackgroundCleaner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/BackgroundCleaner.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/BackgroundCleaner.xcarchive/Products/Applications/BackgroundCleaner.app" Payload/
          zip -qry BackgroundCleaner-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BackgroundCleaner-unsigned-ipa
          path: BackgroundCleaner-unsigned.ipa
