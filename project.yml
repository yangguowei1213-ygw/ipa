name: BackgroundCleaner
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.example.BackgroundCleaner
    DEVELOPMENT_TEAM: ""
targets:
  BackgroundCleaner:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
    entitlements:
      path: Resources/BackgroundCleaner.entitlements
    settings:
      base:
        PRODUCT_NAME: BackgroundCleaner
        INFOPLIST_KEY_CFBundleDisplayName: "一键清理"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    scheme:
      gatherCoverageData: false
